version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # xlsx is installed from vendor/xlsx-0.20.3.tgz and updated by hand; see SECURITY.md.
    ignore:
      - dependency-name: xlsx
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Actions are pinned to commit SHAs with a version comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
