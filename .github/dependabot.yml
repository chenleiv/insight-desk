version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # xlsx is installed from vendor/xlsx-0.20.3.tgz and updated by hand; see SECURITY.md.
    ignore:
      - dependency-name: xlsx
    groups:
      # react and react-dom must have the exact same version. Listed first because a dependency
      # goes to the first group it matches, and the @types packages would otherwise match dev-minor-patch.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Actions are pinned to commit SHAs with a version comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Every github/codeql-action step in a workflow must use the same version.
      codeql-action:
        patterns:
          - github/codeql-action/*
